<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davomat va Spravka Tizimi</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Guruh Davomat Tizimi</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('starsa')">Starsa Kabineti</button>
            <button class="tab-btn" onclick="switchTab('talaba')">Talaba Kabineti</button>
            <button class="tab-btn" onclick="switchTab('tyutor')">Tyutor Kabineti</button>
        </div>

        <!-- 1. STARSA KABINETI -->
        <section id="starsa" class="tab-content active">
            <!-- Yangi talaba qo'shish formasi -->
            <div class="card">
                <h3>Yangi Talaba Qo'shish</h3>
                <div class="add-student-box">
                    <input type="text" id="new-student-name" placeholder="Ism va Familiya kiriting...">
                    <button class="btn success" onclick="addStudent()">Qo'shish</button>
                </div>
            </div>

            <hr>

            <!-- Davomat belgilash -->
            <h2>Tezkor Davomat Belgilash</h2>
            <div class="form-group">
                <label for="att-date">Sana:</label>
                <input type="date" id="att-date">
            </div>
            <div id="student-list" class="student-list">
                <!-- Talabalar va ularning tahrirlash tugmalari JS orqali chiqadi -->
            </div>
            <button class="btn primary" onclick="submitAttendance()">Davomatni saqlash (10 soniya)</button>
        </section>

        <!-- 2. TALABA KABINETI -->
        <section id="talaba" class="tab-content">
            <h2>Sababli Qoldirish / Spravka Yuklash</h2>
            <form id="spravka-form" onsubmit="uploadSpravka(event)">
                <div class="form-group">
                    <label>Talabani tanlang:</label>
                    <select id="student-select" required></select>
                </div>
                <div class="form-group">
                    <label>Sabab kiriting:</label>
                    <textarea id="reason" placeholder="Kasal bo'lib qoldim..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Spravka / Vrach qog'ozi (Foto/PDF):</label>
                    <input type="file" id="spravka-file" accept="image/*,.pdf" required>
                </div>
                <button type="submit" class="btn success">Spravkani Yuklash</button>
            </form>
        </section>

        <!-- 3. TYUTOR KABINETI -->
        <section id="tyutor" class="tab-content">
            <h2>Tyutor Hisobotlari</h2>
            <p>Kunlik, haftalik va oylik davomat statistikasini tayyor PDF formatida yuklab oling:</p>
            <a href="/api/report/pdf" class="btn download" target="_blank">PDF Hisobotni Yuklash</a>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
